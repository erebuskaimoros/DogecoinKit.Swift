name: Thwallet DogecoinKit CI

on:
  push:
    branches: [main, dogecoin-support]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dogecoin-kit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.repository == 'erebuskaimoros/DogecoinKit.Swift' }}
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.4'

      - name: Select simulator
        id: simulator
        run: |
          simulator_id=$(xcrun simctl list devices available --json | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices")
            iphone = devices.values.flatten.find { |device| device.fetch("name").start_with?("iPhone") }
            abort "No available iPhone simulator" unless iphone
            print iphone.fetch("udid")
          ')
          test -n "$simulator_id"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme DogecoinKit

      - name: Run package tests
        run: |
          set -o pipefail
          xcodebuild \
            -scheme DogecoinKit \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -resultBundlePath "$RUNNER_TEMP/DogecoinKit.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/DogecoinKit.xcresult" \
            --compact |
            ruby -rjson -e '
              count = JSON.parse(STDIN.read).fetch("totalTestCount")
              abort "No tests executed" unless count.positive?
            '
